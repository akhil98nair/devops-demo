# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  name: Default

steps:
- script: docker build -t simplenodejsapp .
  displayName: 'Build Docker image'
- script: docker run -d -p 3000:3000 simplenodejsapp
  displayName: 'Run Docker container'
- script: docker ps
  displayName: 'List running Docker containers'
- script: |
    echo "Waiting for the application to be ready..."
    for i in {1..10}; do
      curl -X POST http://localhost:3000/tasks -H "Content-Type: application/json" -d '{"title": "Sample Task", "completed": false}' && break
      echo "Retrying in 5 seconds..."
      sleep 5
    done
  displayName: 'Test application'
